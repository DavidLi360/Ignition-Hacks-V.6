{% extends "layout.html" %}

{% block title %}MemoType | Test{% endblock %}

{% block body %}
<div id="flashcard-container" class="panel">
  <a href="/" id="home-button" class="link-chip button-secondary">← Home</a>

  <div class="page-kicker">Test mode</div>
  <h1>Recall from memory.</h1>
  <p class="page-subtitle">Type the answer without looking. The app tracks similarity, WPM, and review timing for each card.</p>

  <div id="question"></div>

  <div id="input-container">
    <textarea
      id="answer-input"
      rows="4"
      placeholder="Type your answer here..."
      autofocus
    ></textarea>
  </div>

  <div id="feedback"></div>
  <button id="next-button">Next Card</button>

  <script src="{{ url_for('static', filename='js/test.js') }}"></script>
</div>
{% endblock %}
