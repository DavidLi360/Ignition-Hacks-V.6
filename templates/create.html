{% extends "layout.html" %}

{% block title %}MemoType | Create{% endblock %}

{% block body %}
<div class="page-shell create-page-shell">
    <a href="/" id="home-button" class="link-chip button-secondary create-home-button">← Home</a>

    <section class="panel form-card">
        <div class="page-kicker">Build a deck</div>
        <h1 class="page-title" style="font-size: clamp(2rem, 3vw, 3.2rem); margin-top: 12px;">Create a new flashcard set</h1>
        <p class="page-subtitle">Add a title, drop in a description, and build out cards manually or from a DOCX import.</p>

        <form method="POST" action="{{ url_for('create') }}" id="flashcard-form" class="stack" style="margin-top: 22px;">
            <div class="form-grid">
                <div>
                    <label class="field-label" for="title">Set title</label>
                    <input type="text" name="title" id="title" placeholder="e.g. Biology Chapter 1" required>
                </div>
                <div>
                    <label class="field-label" for="description">Description</label>
                    <textarea name="description" id="description" placeholder="Add a short note for what this deck covers..."></textarea>
                </div>
            </div>

            <div id="flashcards"></div>

            <div class="buttons">
                <button type="button" class="add-btn" onclick="addFlashcard()">+ Add Flashcard</button>
                <input type="file" id="fileChooser" accept=".csv,.docx, application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/csv">
                <button type="submit" class="save-btn">Save All</button>
            </div>
        </form>
    </section>
</div>

<script src="{{ url_for('static', filename='js/create.js') }}"></script>
{% endblock %}
