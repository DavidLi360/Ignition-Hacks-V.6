{% extends "layout.html" %}

{% block title %}MemoType | Learn{% endblock %}

{% block body %}
    <div id="flashcard-container" class="panel">
        <a href="/" id="home-button" class="link-chip button-secondary">← Home</a>
        <div class="page-kicker">Learn mode</div>
        <h1>Type with the answer visible.</h1>
        <p class="page-subtitle">This mode is for fast repetition. You can see the answer while you build muscle memory.</p>
        <div id="question"></div>
        <div id="input-container">
            <span id="typed-text"></span><span id="remaining-text"></span>
        </div>
        <input type="text" id="answer-input" autofocus>
        <div id="feedback"></div>
        <button id="next-button">Next Card</button>

        <script src="{{ url_for('static', filename='js/learn.js') }}"></script>
    </div>
{% endblock %}
